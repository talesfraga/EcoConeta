<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <title>Redefinir Senha - EcoConecta+</title>
</head>

<body>

    <div class="card-login">

        <img id="logo" src="./src/img/logoSemfundo copy.jpeg" alt="logo">

        <p id="fraseLogo">Conectando você ao futuro sustentável</p>

        <h2 id="titulo">Redefinir Senha</h2>

        <input type="password" id="novaSenha" placeholder="Nova senha">
        <input type="password" id="confirmarSenha" placeholder="Confirmar nova senha">

        <button id="btnRedefinir" onclick="redefinirSenha()">Redefinir Senha</button>

        <p id="mensagem" class="msg"></p>

        <div class="cadastro">
            <p><a href="index.html">Voltar ao Login</a></p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/auth.js"></script>

    <script>
        // Script específico para redefinição de senha
        async function redefinirSenha() {
            const novaSenha = document.getElementById("novaSenha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;
            const msg = document.getElementById("mensagem");

            msg.className = "msg";

            if (!novaSenha || !confirmarSenha) {
                msg.innerText = "Preencha todos os campos!";
                msg.classList.add("erro");
                return;
            }

            if (novaSenha !== confirmarSenha) {
                msg.innerText = "As senhas não coincidem!";
                msg.classList.add("erro");
                return;
            }

            if (novaSenha.length < 6) {
                msg.innerText = "A senha deve ter pelo menos 6 caracteres!";
                msg.classList.add("erro");
                return;
            }

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: novaSenha
                });

                if (error) {
                    msg.innerText = "Erro ao redefinir senha. Tente novamente.";
                    msg.classList.add("erro");
                    return;
                }

                msg.innerText = "Senha redefinida com sucesso!";
                msg.classList.add("sucesso");

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);

            } catch (err) {
                console.error("Erro na redefinição:", err);
                msg.innerText = "Erro ao redefinir senha. Tente novamente.";
                msg.classList.add("erro");
            }
        }
    </script>

</body>

</html>
